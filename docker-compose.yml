services:
  simulation-area-permissions:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /workspace/simulation_areas &&
        chown -R 1000:1000 /workspace/simulation_areas &&
        chmod 0755 /workspace/simulation_areas
    volumes:
      - ./OUTPUT/simulation_areas:/workspace/simulation_areas

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    volumes:
      - nginx-tile-cache:/var/cache/nginx/simulation-tiles
    depends_on:
      api:
        condition: service_started

  model-assets:
    build:
      context: .
      dockerfile: bayuquan/Dockerfile.assets
    command: >-
      /data/elevation.tif
      /workspace/OUTPUT/model/web/elevation_cog.tif
      --buildings /workspace/OUTPUT/buildings/buildings.gpkg
      --model-inputs-target /workspace/OUTPUT/model/web/model_inputs_cog.tif
      --derived-dem-target /workspace/OUTPUT/model/web/elevation_10m_cog.tif
      --derived-model-inputs-target /workspace/OUTPUT/model/web/model_inputs_10m_cog.tif
      --manifest-target /workspace/OUTPUT/model/dem-products.json
      --vertical-datum "WGS 84 ellipsoidal height"
      --s3-endpoint-url http://minio:9000
      --s3-bucket model-products
      --s3-access-key anuga
      --s3-secret-key anuga-secret
    working_dir: /opt/model-assets
    volumes:
      - ./bayuquan/elevation.tif:/data/elevation.tif:ro
      - ./OUTPUT:/workspace/OUTPUT
    depends_on:
      minio:
        condition: service_healthy

  api:
    build: .
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment: &service-environment
      BAYUQUAN_PROJECT_ROOT: /workspace
      PYTHONPATH: /opt/webgis
      DATABASE_URL: postgresql+psycopg://anuga:anuga@postgres:5432/anuga
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: anuga
      S3_SECRET_KEY: anuga-secret
      S3_BUCKET: simulation-jobs
      AWS_ACCESS_KEY_ID: anuga
      AWS_SECRET_ACCESS_KEY: anuga-secret
      AWS_S3_ENDPOINT: minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      TITILER_URL: http://titiler
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      DEM_PRODUCT_MANIFEST: /workspace/OUTPUT/model/dem-products.json
    ports:
      - "8000:8000"
    working_dir: /opt/webgis
    volumes:
      - ./OUTPUT:/workspace/OUTPUT:ro
      - ./OUTPUT/simulation_areas:/workspace/simulation_areas
    depends_on:
      model-assets:
        condition: service_completed_successfully
      simulation-area-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: .
    command: >-
      celery -A apps.worker.tasks:celery_app worker
      --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 -Q standard
    environment: *service-environment
    working_dir: /opt/webgis
    volumes:
      - ./OUTPUT:/workspace/OUTPUT:ro
      - ./OUTPUT/simulation_areas:/workspace/simulation_areas
    depends_on:
      simulation-area-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  high-resource-worker:
    build: .
    command: >-
      celery -A apps.worker.tasks:celery_app worker
      --loglevel=INFO --concurrency=1 --prefetch-multiplier=1
      -Q high-resource -n high-resource@%h
    environment: *service-environment
    working_dir: /opt/webgis
    volumes:
      - ./OUTPUT:/workspace/OUTPUT:ro
      - ./OUTPUT/simulation_areas:/workspace/simulation_areas
    depends_on:
      simulation-area-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: anuga
      POSTGRES_USER: anuga
      POSTGRES_PASSWORD: anuga
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anuga -d anuga"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: anuga
      MINIO_ROOT_PASSWORD: anuga-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      AWS_ACCESS_KEY_ID: anuga
      AWS_SECRET_ACCESS_KEY: anuga-secret
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      # Frames are added to an existing prefix while the simulation runs.
      # Prevent GDAL from caching an incomplete S3 directory listing.
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
    ports:
      - "8001:80"
    volumes:
      - ./OUTPUT:/workspace/OUTPUT:ro
    depends_on:
      model-assets:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-tile-cache:
