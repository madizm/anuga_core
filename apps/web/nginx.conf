proxy_cache_path /var/cache/nginx/simulation-tiles
    levels=1:2
    keys_zone=simulation_tiles:32m
    max_size=5g
    inactive=30d
    use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/api/jobs/[^/]+/frames/[0-9]+/tiles/(depth|stage|speed)/[0-9]+/[0-9]+/[0-9]+\.png$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_cache simulation_tiles;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Tile-Cache $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
